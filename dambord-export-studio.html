<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dambord Export Studio v1.2.0</title>
  <style>
    body { background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
    .version-badge { background-color: #34495e; color: #bdc3c7; font-size: 14px; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-top: -10px; margin-bottom: 20px; border: 1px solid #7f8c8d; }
    .btn { background-color: #1565c0; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin: 10px; }
    .btn-success { background-color: #2e7d32; }
    #canvas-container { margin-top: 20px; display: flex; justify-content: center; }
    canvas { border: 2px solid #fff; background-color: #b58863; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    /* Pop-up Overlay voor iPad */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
    .modal-content { background: #34495e; padding: 20px; border-radius: 8px; text-align: center; max-width: 90%; }
    .modal img { border: 2px solid white; max-width: 100%; height: auto; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .close-btn { background-color: #e74c3c; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>Dambord Export Studio</h1>
  <div class="version-badge">Versie 1.2.0</div>
  <p>Test de exportfunctionaliteit voor Windows en iPad (Nu met HD/Retina support)</p>

  <!-- Knoppen -->
  <button id="add-piece-btn" class="btn">1. Plaats Damsteen</button>
  <button id="export-btn" class="btn btn-success">2. Save as PNG</button>

  <!-- Het test-canvas -->
  <div id="canvas-container">
    <canvas id="testCanvas"></canvas>
  </div>

  <!-- De iPad Pop-up Overlay -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <h3>📱 Afbeelding Gegenereerd</h3>
      <p>Houd de afbeelding hieronder lang ingedrukt en kies <br><strong>'Voeg toe aan Foto's'</strong> of <strong>'Bewaar in Bestanden'</strong>.</p>
      <img id="exportedImage" src="" alt="Dambord Export">
      <br>
      <button id="closeModalBtn" class="btn close-btn">Sluiten</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // APPLICATIE METADATA
    // App Naam: Dambord Export Studio
    // Versie:   1.2.0 (Retina + Cross-Platform Export Patch)
    // Datum:    September 2026
    // =========================================================================

    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');

    // --- RETINA / IPAD RESOLUTIE LOGICA ---
    // We willen dat het bord visueel 200x200 pixels blijft
    const basisBreedte = 200;
    const basisHoogte = 200;
    
    // Bepaal de scherptefactor van het scherm (1 voor pc, 2 of 3 voor iPad)
    const scale = window.devicePixelRatio || 1; 

    // Stel de interne (scherpe) resolutie in
    canvas.width = basisBreedte * scale;
    canvas.height = basisHoogte * scale;

    // Stel de visuele grootte op het scherm in via CSS pixels
    canvas.style.width = basisBreedte + "px";
    canvas.style.height = basisHoogte + "px";

    // Schaal alle toekomstige JavaScript-tekeningen automatisch mee
    ctx.scale(scale, scale);
    // --------------------------------------

    // Functie om de basis (het bruine bord) te tekenen
    function tekenBord() {
      ctx.fillStyle = '#b58863';
      ctx.fillRect(0, 0, basisBreedte, basisHoogte);
    }

    // Teken het bord bij het opstarten
    tekenBord();

    // Functie om 1 witte damsteen te tekenen
    document.getElementById('add-piece-btn').addEventListener('click', () => {
      tekenBord();

      // Teken de schijf exact in het midden (100, 100) van onze basismaat
      ctx.beginPath();
      ctx.arc(100, 100, 40, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 4;
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(100, 100, 25, 0, 2 * Math.PI);
      ctx.strokeStyle = '#eeeeee';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // De universele exportfunctie
    document.getElementById('export-btn').addEventListener('click', () => {
      try {
        const dataUrl = canvas.toDataURL('image/png');
        
        if (!dataUrl || dataUrl === "data:,") {
          alert("Fout bij het genereren van de afbeelding.");
          return;
        }

        // Detecteer of het een iOS apparaat (iPad / iPhone) is
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIOS) {
          // Toon de inline pop-up op de iPad
          document.getElementById('exportedImage').src = dataUrl;
          document.getElementById('imageModal').style.display = 'flex';
        } else {
          // Directe download voor Windows
          const link = document.createElement('a');
          link.download = 'test-damsteen.png';
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          setTimeout(() => { document.body.removeChild(link); }, 100);
        }

      } catch (error) {
        alert("Er ging OS iets mis: " + error.message);
      }
    });

    // Sluit de pop-up
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('imageModal').style.display = 'none';
    });
  </script>

</body>
</html>
